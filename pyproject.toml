[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consensus-water-analysis"
version = "0.1.0"
description = "Conserved water analysis from local mmCIF structures"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "biotite>=1.6",
    "gemmi>=0.7.5",
    "hdbscan>=0.8.44",
    "joblib>=1.5",
    "numpy>=2.4",
    "scipy>=1.17",
    "pandas>=3.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.11",
    "tqdm>=4.68",
    "pyyaml>=6.0",
    "requests>=2.32",
    "loguru>=0.7.3",
]

[tool.hatch.build.targets.wheel]
packages = ["cw"]

[dependency-groups]
dev = [
    "prek",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
    "marimo",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# config.py is gitignored, so it is absent in CI and present locally. Without
# this, isort classifies it as third-party in CI and first-party locally, and the
# two disagree about import order.
known-first-party = ["cw", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
