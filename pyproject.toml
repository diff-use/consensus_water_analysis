[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consensus-water-analysis"
version = "0.1.0"
description = "Conserved water analysis from local mmCIF structures"
requires-python = ">=3.12"
dependencies = [
    "biotite",
    "gemmi",
    "biotite",
    "hdbscan",
    "numpy",
    "scipy",
    "pandas",
    "seaborn",
    "matplotlib",
    "tqdm",
    "pyyaml",
    "requests",
    "loguru",
]

[tool.hatch.build.targets.wheel]
packages = ["cw"]

[dependency-groups]
dev = [
    "prek",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
    "marimo",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
